<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Administrador</title><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/s.css?v=5"></head><body>
<header><span class="logo" id="logo">ADMIN</span><nav><a id="lp" href="#">Mi página</a><a id="la" href="#">Mi agenda</a></nav></header><main>
<div id="plan"></div>
<h2>Resumen</h2><div class="chips" id="per"></div><div id="ins"></div>
<div class="acc" style="margin-bottom:10px"><button onclick="mover(-1)" aria-label="Día anterior">‹</button><input type="date" id="dia" style="flex:1;margin:6px 0 0"><button onclick="mover(1)" aria-label="Día siguiente">›</button><button onclick="mover(0)">Hoy</button></div>
<h2>Citas del día</h2><div id="lista"></div><h2 style="margin-top:24px">Corte de caja</h2><div id="corte"></div>
<h2 style="margin-top:24px">Precios</h2><div id="cat"></div>
<h2 style="margin-top:24px">Mi barbería</h2><div id="aj"></div></main>
<script>
const N=location.pathname.split('/')[1],$=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#lp').href='/'+N;$('#la').href='/'+N+'/agenda';
let K=sessionStorage['k_'+N]||prompt('Contraseña de administrador');
const J=async(u,b,mt)=>{const r=await fetch('/api/'+N+u,{method:mt||(b?'PATCH':'GET'),headers:{'Content-Type':'application/json','x-admin':K},body:b&&JSON.stringify(b)});
if(r.status===401||r.status===429){sessionStorage.removeItem('k_'+N);document.body.innerHTML='<main><h2>'+(r.status===429?'Demasiados intentos':'Contraseña incorrecta')+'</h2><p>Recarga la página para intentar de nuevo.</p></main>';throw 0}
const d=await r.json();if(!r.ok)throw new Error(d.error);sessionStorage['k_'+N]=K;return d};
const hoy=()=>new Date().toLocaleDateString('en-CA');$('#dia').value=hoy();$('#dia').onchange=cargar;
function mover(n){const d=new Date($('#dia').value+'T12:00');n?d.setDate(d.getDate()+n):d.setTime(Date.now());$('#dia').value=d.toLocaleDateString('en-CA');cargar()}
const est=async(id,e)=>{await J('/admin/citas/'+id,{estado:e});cargar()};
const wa=x=>{let d=String(x.telefono).replace(/\D/g,'');if(d.length===10)d='52'+d;
return 'https://wa.me/'+d+'?text='+encodeURIComponent(`Hola ${x.cliente}, te recordamos tu cita el ${$('#dia').value} a las ${x.hora} (${x.servicio} con ${x.barbero}). ¡Te esperamos!`)};
async function cargar(){const f=$('#dia').value,c=await J('/admin/citas?fecha='+f);
$('#lista').innerHTML=c.length?c.map(x=>`<div class="card"><b>${esc(x.hora)}</b> ${esc(x.cliente)} <p>${esc(x.servicio)} con ${esc(x.barbero)} · $${Number(x.precio)} · ${esc(x.estado)} · <a style="color:var(--gold)" href="${esc(wa(x))}">Recordar por WhatsApp</a></p>
<div class="acc"><button onclick="est(${Number(x.id)},'completada')">Completada</button><button onclick="est(${Number(x.id)},'cancelada')">Cancelar</button></div></div>`).join(''):'<p>Sin citas este día.</p>';
const t=await J('/admin/corte?fecha='+f);$('#corte').innerHTML=t.length?t.map(x=>`<div class="card">${esc(x.barbero)}: ${x.cortes} cortes · $${x.total}</div>`).join('')+`<p><b>Total del día: $${t.reduce((a,x)=>a+x.total,0)}</b></p>`:'<p>Aún no hay citas completadas.</p>'}
async function catalogo(){const c=await J('/admin/catalogo');
$('#cat').innerHTML=[['estilos','Servicios',c.estilos],['productos','Productos',c.productos]].map(([t,n,r])=>`<h3>${n}</h3>`+r.map(x=>`<div class="acc" style="align-items:center;margin-bottom:6px"><span style="flex:1;min-width:140px">${esc(x.nombre)}</span><input type="number" min="0" value="${Number(x.precio)}" style="width:90px;margin:0" id="p-${t}-${Number(x.id)}" aria-label="Precio de ${esc(x.nombre)}"><button style="margin:0" onclick="precio('${t}',${Number(x.id)})">Guardar</button><button class="alt" style="margin:0" onclick="borra('${t}',${Number(x.id)})">Quitar</button></div>`).join('')+`<div class="acc" style="align-items:end;margin:14px 0 26px"><input id="n-${t}" placeholder="Nuevo ${t==='estilos'?'servicio':'producto'}" style="flex:1;min-width:140px;margin:0">${t==='estilos'?'<select id="t-estilos" style="width:auto;margin:0"><option value="clásico">Clásico</option><option value="nuevo">Nuevo</option><option value="servicio">Barba / combo</option></select>':''}<input id="v-${t}" type="number" min="0" placeholder="$" style="width:80px;margin:0"><button style="margin:0" onclick="agrega('${t}')">Agregar</button></div>`).join('')}
async function precio(t,id){const v=$(`#p-${t}-${id}`).value;if(v==='')return;await J('/admin/precio',{tabla:t,id,precio:Number(v)});alert('Precio guardado')}
async function agrega(t){try{await J('/admin/item',{tabla:t,nombre:$('#n-'+t).value,tipo:t==='estilos'?$('#t-estilos').value:undefined,precio:Number($('#v-'+t).value)},'POST');catalogo()}catch(e){alert(e.message)}}
async function borra(t,id){if(!confirm('¿Quitar este elemento?'))return;await J('/admin/borrar',{tabla:t,id},'POST');catalogo()}
function banner(a){const d=a.vence?Math.ceil((new Date(a.vence)-Date.now())/864e5):null,P={prueba:'Prueba gratis',basico:'Plan Básico',pro:'Plan Pro'}[a.plan]||a.plan;
$('#plan').innerHTML=`<div class="msg ${a.abierto?'ok':''}" style="margin:0 0 18px"><b>${esc(P)}</b> · ${!a.abierto?'Tu cuenta está vencida o suspendida y tus clientes no pueden agendar. Contáctanos para reactivarla.':d===null?'sin vencimiento':d+' días restantes'}</div>`}
const CAMPOS=[['nombre','Nombre del negocio'],['whatsapp','WhatsApp (10 dígitos)'],['direccion','Dirección'],['maps','Enlace de Google Maps'],['barberos','Barberos (separados por coma)'],['hora_ini','Abre (hora, 0 a 23)'],['hora_fin','Última cita (hora, 0 a 23)']];
async function ajustes(){const a=await J('/admin/ajustes');banner(a);$('#aj').innerHTML=`<p>Tu enlace para clientes: <a style="color:var(--gold)" href="/${N}">${location.host}/${N}</a></p>`+CAMPOS.map(([k,l])=>`<label for="a-${k}">${l}</label><input id="a-${k}" value="${esc(a[k])}">`).join('')+'<button onclick="guardaAj()">Guardar cambios</button>'}
async function guardaAj(){const b={};CAMPOS.forEach(([k])=>b[k]=$('#a-'+k).value);try{await J('/admin/ajustes',b);alert('Cambios guardados')}catch(e){alert(e.message)}}
let DIAS=7;const mx=x=>'$'+Number(x).toLocaleString('es-MX');
function barras(v,et){const M=Math.max(1,...v.map(x=>x[1]));return '<div class="bars">'+v.map(([k,n])=>`<i style="height:${Math.max(2,n/M*100)}%" title="${esc(k)}: ${esc(et(n))}"></i>`).join('')+'</div>'}
function hb(rows){const M=Math.max(1,...rows.map(r=>r[1]));return rows.map(([n,v,t])=>`<div class="hb"><span>${esc(n)}</span><u><i style="width:${v/M*100}%"></i></u><em>${esc(t)}</em></div>`).join('')||'<p>Aún no hay datos.</p>'}
function periodo(){$('#per').innerHTML=[[7,'7 días'],[30,'30 días']].map(([d,t])=>`<button aria-pressed="${d===DIAS}" onclick="DIAS=${d};periodo();insights()">${t}</button>`).join('')}
async function insights(){const r=await J('/admin/insights?dias='+DIAS),c=r.estados.completada||0,x=r.estados.cancelada||0,ing=r.porDia.reduce((a,d)=>a+d.ingresos,0);
const mapa=Object.fromEntries(r.porDia.map(d=>[d.f,d.ingresos])),dias=[];for(let i=DIAS-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dias.push(d.toLocaleDateString('en-CA'))}
const k=(b,t)=>`<div class="kpi"><b>${b}</b><span>${t}</span></div>`,H=r.horas,nu=r.clientes.total-r.clientes.recurrentes;
$('#ins').innerHTML=(r.sinCerrar?`<div class="msg" style="margin-bottom:16px">Tienes <b>${r.sinCerrar}</b> citas pasadas sin cerrar. Márcalas como completadas o canceladas para que tu corte de caja sea exacto.</div>`:'')+
`<div class="kpis">${k(mx(ing),'Ingresos')}${k(c,'Cortes hechos')}${k(c?mx(ing/c):'—','Ticket promedio')}${k(c+x?Math.round(x/(c+x)*100)+'%':'—','Cancelaciones')}${k(r.porAtender,'Citas por atender')}</div>
<h3>Ingresos por día</h3>${barras(dias.map(f=>[f,mapa[f]||0]),mx)}<div class="ejes"><span>${dias[0].slice(5)}</span><span>${dias[dias.length-1].slice(5)}</span></div>
<h3>Servicios más pedidos</h3>${hb(r.servicios.map(s=>[s.servicio,s.n,s.n+' · '+mx(s.ingresos)]))}
<h3>Por barbero</h3>${hb(r.barberos.map(b=>[b.barbero,b.ingresos,b.n+' cortes · '+mx(b.ingresos)]))}
<h3>Horas con más citas</h3>${barras(H.map(h=>[h.hora,h.n]),n=>n+' citas')}<div class="ejes"><span>${H.length?H[0].hora:''}</span><span>${H.length?H[H.length-1].hora:''}</span></div>
<h3>Clientes</h3>${hb([['Recurrentes',r.clientes.recurrentes,r.clientes.recurrentes+' clientes'],['Nuevos',nu,nu+' clientes']])}`}
cargar();catalogo();ajustes();periodo();insights();
</script></body></html>
