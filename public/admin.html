<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Onyx · Admin</title><link rel="stylesheet" href="s.css?v=3"></head><body>
<header><span class="logo">ONYX · ADMIN</span></header><main>
<div class="acc" style="margin-bottom:10px"><button onclick="mover(-1)" aria-label="Día anterior">‹</button><input type="date" id="dia" style="flex:1;margin:6px 0 0"><button onclick="mover(1)" aria-label="Día siguiente">›</button><button onclick="mover(0)">Hoy</button></div>
<h2>Citas del día</h2><div id="lista"></div><h2 style="margin-top:24px">Corte de caja</h2><div id="corte"></div>
<h2 style="margin-top:24px">Precios</h2><div id="cat"></div></main>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let K=sessionStorage.k||prompt('Contraseña de administrador');
const J=async(u,b)=>{const r=await fetch(u,{method:b?'PATCH':'GET',headers:{'Content-Type':'application/json','x-admin':K},body:b&&JSON.stringify(b)});
if(r.status===401||r.status===429){sessionStorage.removeItem('k');document.body.innerHTML='<main><h2>'+(r.status===429?'Demasiados intentos':'Contraseña incorrecta')+'</h2><p>Recarga la página para intentar de nuevo.</p></main>';throw 0}
sessionStorage.k=K;return r.json()};
const hoy=()=>new Date().toLocaleDateString('en-CA');$('#dia').value=hoy();$('#dia').onchange=cargar;
function mover(n){const d=new Date($('#dia').value+'T12:00');n?d.setDate(d.getDate()+n):d.setTime(Date.now());$('#dia').value=d.toLocaleDateString('en-CA');cargar()}
const est=async(id,e)=>{await J('/api/admin/citas/'+id,{estado:e});cargar()};
const wa=x=>{let d=String(x.telefono).replace(/\D/g,'');if(d.length===10)d='52'+d;
return 'https://wa.me/'+d+'?text='+encodeURIComponent(`Hola ${x.cliente}, te recordamos tu cita en Onyx Barbería el ${$('#dia').value} a las ${x.hora} (${x.servicio} con ${x.barbero}). ¡Te esperamos!`)};
async function cargar(){const f=$('#dia').value,c=await J('/api/admin/citas?fecha='+f);
$('#lista').innerHTML=c.length?c.map(x=>`<div class="card" style="margin-bottom:8px"><b>${esc(x.hora)}</b> ${esc(x.cliente)} <p>${esc(x.servicio)} con ${esc(x.barbero)} · $${Number(x.precio)} · ${esc(x.estado)} · <a style="color:var(--gold)" href="${esc(wa(x))}">Recordar por WhatsApp</a></p>
<div class="acc"><button onclick="est(${Number(x.id)},'completada')">Completada</button><button onclick="est(${Number(x.id)},'cancelada')">Cancelar</button></div></div>`).join(''):'<p>Sin citas este día.</p>';
const t=await J('/api/admin/corte?fecha='+f);$('#corte').innerHTML=t.length?t.map(x=>`<div class="card" style="margin-bottom:8px">${esc(x.barbero)}: ${x.cortes} cortes · $${x.total}</div>`).join('')+`<p><b>Total del día: $${t.reduce((a,x)=>a+x.total,0)}</b></p>`:'<p>Aún no hay citas completadas.</p>'}
async function catalogo(){const c=await J('/api/admin/catalogo');
$('#cat').innerHTML=[['estilos','Servicios',c.estilos],['productos','Productos',c.productos]].map(([t,n,r])=>`<h3>${n}</h3>`+r.map(x=>`<div class="acc" style="align-items:center;margin-bottom:6px"><span style="flex:1">${esc(x.nombre)}</span><input type="number" min="0" value="${Number(x.precio)}" style="width:90px;margin:0" id="p-${t}-${Number(x.id)}" aria-label="Precio de ${esc(x.nombre)}"><button style="margin:0" onclick="precio('${t}',${Number(x.id)})">Guardar</button></div>`).join('')).join('')}
async function precio(t,id){const v=$(`#p-${t}-${id}`).value;if(v==='')return;await J('/api/admin/precio',{tabla:t,id,precio:Number(v)});alert('Precio guardado')}
cargar();catalogo();
</script></body></html>
