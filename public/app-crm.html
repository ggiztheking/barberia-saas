<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>CRM</title><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CRM"><link rel="apple-touch-icon" href="/icon-crm.png"><link rel="icon" href="/icon-crm.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/s.css?v=15">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--line:#232836}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:24px;margin:0;flex:1;font-weight:500}.top a{color:var(--dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
main{max-width:720px;padding:22px 18px 40px}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(11,13,18,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font:400 10.5px 'Jost',sans-serif;letter-spacing:.06em;text-transform:none;position:relative}
.bn button:hover{background:none;color:var(--ink)}.bn button[aria-current=true]{color:var(--gold)}.bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bn .bd{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#12100a;font-size:10px;line-height:17px;padding:0 4px;font-weight:500}
.hola{font:400 32px/1.15 'Cormorant Garamond',Georgia,serif;margin:4px 0 2px}.sub{color:var(--dim);margin:0 0 20px}
.hero-card{display:block;width:100%;text-align:left;border:1px solid var(--gold);background:linear-gradient(135deg,#1a1f2f,var(--panel));padding:20px;margin-bottom:22px;text-transform:none;letter-spacing:0;color:var(--ink);font:inherit}
.hero-card:hover{background:linear-gradient(135deg,#1d2335,var(--panel));color:var(--ink)}.hero-card b{display:block;font:500 46px/1 'Cormorant Garamond',Georgia,serif;color:var(--gold);margin:4px 0}.hero-card small{color:var(--dim)}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.seg-c{background:var(--panel);border:1px solid var(--line);padding:14px 10px;text-align:left;color:var(--ink);text-transform:none;letter-spacing:0;font:inherit;display:flex;flex-direction:column;gap:2px}
.seg-c:hover{background:var(--panel);border-color:#3b4766;color:var(--ink)}.seg-c b{font:500 28px/1 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.seg-c span{font-size:12px;color:var(--dim)}
.sec-t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.card{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:10px}
.card .cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.card .cab b{font:500 21px 'Cormorant Garamond',Georgia,serif;flex:1}.card .cab small{color:var(--dim)}
.card .txt{font-size:15px;color:var(--ink);opacity:.86;margin:10px 0 12px;white-space:pre-line;border-left:2px solid var(--line);padding-left:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);text-transform:none;letter-spacing:0;font:inherit}
.row:hover{background:#ffffff06;color:var(--ink)}.row .av{margin:0;flex:0 0 40px;width:40px;height:40px;font-size:18px}.row .i{flex:1;min-width:0}.row .i b{font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .i small{color:var(--dim);font-size:13px}
.pill{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--dim);padding:2px 7px;margin:4px 4px 0 0}
.pill.vip{border-color:var(--gold);color:var(--gold)}.pill.riesgo,.pill.perdido{border-color:#5e3333;color:#e3a0a0}.pill.nuevo,.pill.prospecto{border-color:#2f5a42;color:#8fd1a6}
.wa{background:#25d366;border-color:#25d366;color:#08210f}.wa:hover{background:transparent;color:#25d366}
.vista{animation:fi .25s ease both}.vacio{border:1px dashed var(--line);padding:18px;color:var(--dim);font-size:15px}
textarea{font:inherit;width:100%;padding:12px;margin:8px 0 14px;background:transparent;color:var(--ink);border:1px solid var(--line);resize:vertical}
.ficha-k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.ficha-k div{background:var(--panel);border:1px solid var(--line);padding:12px}.ficha-k b{display:block;font:500 24px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.ficha-k span{font-size:12px;color:var(--dim)}
.ph{width:100%;aspect-ratio:4/5;background:#0b0e17 center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--dim);cursor:pointer;margin:8px 0 14px}
.post{display:flex;gap:12px}.post .mi{flex:0 0 84px;height:105px;background:#0b0e17 center/cover no-repeat;border:1px solid var(--line)}.post .i{flex:1;min-width:0}.post .i p{font-size:14px;margin:4px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);opacity:.85}
.chk{display:flex;gap:18px;margin:8px 0 14px}.chk label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}.chk input{width:auto;margin:0}
.est{font-size:12px;color:var(--dim)}.est.error{color:#e3a0a0}.est.lista{color:var(--gold)}.est.publicada{color:#8fd1a6}
.mas button.row{justify-content:space-between}
.vars{font-size:13px;color:var(--dim)}.vars code{color:var(--gold);font-family:inherit}
.back{background:none;border:0;color:var(--gold);padding:0 0 14px;letter-spacing:.12em;font-size:11px}.back:hover{background:none;color:var(--ink)}
</style></head><body>
<header class="top"><h1 id="tt">CRM</h1><a id="ap" href="#">Panel</a></header>
<main id="v"></main>
<nav class="bn" id="bn">
<button data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-v="avisos"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Avisos<span class="bd" id="bd" hidden></span></button>
<button data-v="clientes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>Clientes</button>
<button data-v="contenido"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 10"/></svg>Contenido</button>
<button data-v="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Más</button>
</nav>
<script src="/crm-app.js?v=1"></script>
</body></html>
