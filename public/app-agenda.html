<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#07090f"><link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/s.css?v=4"></head><body>
<header><a class="logo" id="logo" href="#" style="text-decoration:none"></a><nav><a href="#agendar">Agendar</a><a href="#estilos">Estilos</a><a href="#productos">Productos</a><a href="#mis">Mis citas</a></nav></header>
<main>
<section id="agendar"><h2>Agenda tu cita</h2>
<label for="srv">Servicio</label><select id="srv"></select><label for="bar">Barbero</label><select id="bar"></select><label for="dia">Fecha</label><input type="date" id="dia">
<p id="hl">Elige barbero y fecha para ver horarios.</p><div class="chips" id="horas"></div>
<input id="nom" placeholder="Tu nombre" autocomplete="name"><input id="tel" placeholder="Tu WhatsApp" inputmode="tel" autocomplete="tel">
<button id="go">Confirmar cita</button><div id="res" role="status"></div></section>
<section id="estilos" hidden><h2>Estilos de corte</h2><div class="chips" id="filtros"></div><div class="grid" id="eg"></div></section>
<section id="productos" hidden><h2>Productos</h2><div class="grid" id="pg"></div></section>
<section id="mis" hidden><h2>Mis citas</h2><div id="mlist"></div></section>
</main><footer style="max-width:760px;margin:auto;padding:0 24px 40px;color:var(--dim)" id="fn"></footer>
<script>
const N=location.pathname.split('/')[1],$=s=>document.querySelector(s),m=x=>'$'+Number(x);let HORAS=[];
const J=(u,b)=>fetch('/api/'+N+u,b&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);return d});
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=f=>new Date(f+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
let S={};try{S=JSON.parse(localStorage['b_'+N]||'{}')}catch(e){}S.codigos=S.codigos||[];const guarda=()=>{try{localStorage['b_'+N]=JSON.stringify(S)}catch(e){}};
let E=[],sel='',tipo='todos';$('link[rel=manifest]').href='/'+N+'/manifest.json';$('#logo').href='/'+N;
function ir(){const h=(location.hash||'#agendar').slice(1);document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==h);document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+h));if(h==='mis')mis()}
addEventListener('hashchange',ir);ir();
function pintaE(){$('#eg').innerHTML=E.filter(e=>tipo==='todos'||e.tipo===tipo).map(e=>'<div class="card"><h3>'+esc(e.nombre)+'</h3><p>'+esc(e.descripcion)+'</p><b>'+m(e.precio)+'</b></div>').join('')}
function filtros(){$('#filtros').innerHTML=[['todos','Todos'],['clásico','Clásicos'],['nuevo','Nuevos'],['servicio','Con barba']].map(([k,t])=>'<button aria-pressed="'+(k===tipo)+'" data-k="'+k+'">'+t+'</button>').join('');
document.querySelectorAll('#filtros button').forEach(b=>b.onclick=()=>{tipo=b.dataset.k;filtros();pintaE()})}
async function horas(){sel='';const f=$('#dia').value,b=$('#bar').value;if(!f||!b)return;const t=await J('/horarios?fecha='+f+'&barbero='+encodeURIComponent(b)),ya=f===hoy()?new Date().getHours():-1;
$('#hl').textContent='Horarios disponibles';$('#horas').innerHTML=HORAS.map(h=>'<button data-h="'+h+'" '+(t.includes(h)||+h.slice(0,2)<=ya?'disabled':'')+' aria-pressed="false">'+h+'</button>').join('');
document.querySelectorAll('#horas button').forEach(x=>x.onclick=()=>{sel=x.dataset.h;document.querySelectorAll('#horas button').forEach(y=>y.setAttribute('aria-pressed',y===x))})}
async function mis(){const el=$('#mlist');if(!S.codigos.length){el.innerHTML='<p>Aquí verás tus próximas citas cuando agendes una.</p>';return}
try{const c=await J('/mis-citas',{codigos:S.codigos});
el.innerHTML=c.length?c.map(x=>'<div class="card"><h3>'+esc(x.servicio)+' · '+m(x.precio)+'</h3><p>'+fd(x.fecha)+' a las '+esc(x.hora)+' con '+esc(x.barbero)+'</p>'+(x.estado==='pendiente'?'<button data-c="'+esc(x.codigo)+'">Cancelar cita</button>':'<p>Cita '+esc(x.estado)+'</p>')+'</div>').join(''):'<p>No tienes citas próximas.</p>';
el.querySelectorAll('button[data-c]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Cancelar esta cita?'))return;try{await J('/cancelar',{codigo:b.dataset.c});mis()}catch(e){alert(e.message)}})}catch(e){el.textContent='No se pudieron cargar tus citas.'}}
$('#dia').min=$('#dia').value=hoy();$('#dia').onchange=$('#bar').onchange=horas;$('#nom').value=S.nom||'';$('#tel').value=S.tel||'';
$('#go').onclick=async()=>{const r=$('#res');r.className='msg';
try{const nom=$('#nom').value.trim(),tel=$('#tel').value.trim();if(!sel||!nom||!tel)throw new Error('Elige un horario y escribe tu nombre y WhatsApp');
const f=$('#dia').value,sv=$('#srv').value,b=$('#bar').value,d=await J('/citas',{cliente:nom,telefono:tel,barbero:b,servicio:sv,fecha:f,hora:sel});
S.nom=nom;S.tel=tel;S.codigos.push(d.codigo);guarda();
const p=f.replace(/-/g,''),h0=sel.replace(':',''),h1=String(+sel.slice(0,2)+1).padStart(2,'0')+sel.slice(3,5);
const ics='BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:'+d.codigo+'@barberia\nDTSTAMP:'+p+'T000000Z\nDTSTART;TZID=America/Merida:'+p+'T'+h0+'00\nDTEND;TZID=America/Merida:'+p+'T'+h1+'00\nSUMMARY:Cita en '+$('#logo').textContent+'\nEND:VEVENT\nEND:VCALENDAR';
r.className='msg ok';r.innerHTML='<b>Cita confirmada, '+esc(nom)+'.</b><p>'+esc(sv)+' con '+esc(b)+' · '+fd(f)+' a las '+esc(sel)+' · '+m(d.precio)+'</p><a class="btn" download="cita.ics" href="data:text/calendar;charset=utf8,'+encodeURIComponent(ics)+'">Agregar a mi calendario</a> <a style="color:var(--gold)" href="#mis">Ver mis citas</a>';horas()}
catch(e){r.textContent=e.message;horas()}};
(async()=>{const i=await J('/info');document.title='Agenda · '+i.nombre;$('#logo').textContent=i.nombre;
HORAS=Array.from({length:i.hora_fin-i.hora_ini+1},(_,k)=>String(i.hora_ini+k).padStart(2,'0')+':00');
$('#fn').innerHTML=esc(i.nombre)+(i.direccion?' · '+esc(i.direccion):'')+(i.maps?' · <a style="color:var(--gold)" href="'+esc(i.maps)+'">Cómo llegar</a>':'')+(i.whatsapp?' · <a style="color:var(--gold)" href="https://wa.me/'+esc(i.whatsapp)+'">WhatsApp</a>':'');
$('#bar').innerHTML=i.barberos.map(b=>'<option>'+esc(b)+'</option>').join('');
E=await J('/estilos');filtros();pintaE();$('#srv').innerHTML=E.map(e=>'<option value="'+esc(e.nombre)+'">'+esc(e.nombre)+' · '+m(e.precio)+'</option>').join('');
$('#pg').innerHTML=(await J('/productos')).map(p=>'<div class="card"><h3>'+esc(p.nombre)+'</h3><p>'+esc(p.descripcion)+'</p><b>'+m(p.precio)+'</b></div>').join('');
i.abierto?horas():$('#agendar').innerHTML='<h2>Agenda</h2><p>Esta barbería no está recibiendo citas en línea por ahora.'+(i.whatsapp?' Escríbenos por <a style="color:var(--gold)" href="https://wa.me/'+esc(i.whatsapp)+'">WhatsApp</a>.':'')+'</p>'})();
</script></body></html>
