<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Cartel</title><link rel="icon" href="/icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#111;font:300 18px/1.6 'Jost',system-ui,sans-serif;text-align:center}
.p{max-width:560px;margin:auto;padding:56px 28px}.r{width:44px;height:1px;background:#a8872f;margin:0 auto 26px}
h1{font:500 clamp(44px,12vw,72px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}h2{font:500 28px 'Cormorant Garamond',Georgia,serif;margin:0 0 28px;color:#555;font-style:italic}
#qr{display:inline-block;padding:18px;border:1px solid #ddd}#qr img{display:block}p{color:#555;margin:22px 0 4px}b{color:#111;word-break:break-all}
button{margin-top:30px;font:400 12px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;background:#111;color:#fff;border:0;padding:16px 28px;cursor:pointer}
@media print{button{display:none}.p{padding-top:40px}}
</style></head><body><div class="p"><div class="r"></div><h1 id="nom"></h1><h2>Agenda tu cita en un minuto</h2><div id="qr"></div>
<p>Escanea el código con la cámara de tu celular</p><p><b id="u"></b></p><button onclick="print()">Imprimir cartel</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const N=location.pathname.split('/')[1],url=location.origin+'/'+N+'/agenda';
document.getElementById('u').textContent=url.replace(/^https?:\/\//,'');
fetch('/api/'+N+'/info').then(r=>r.json()).then(i=>{document.getElementById('nom').textContent=i.nombre;document.title='Cartel · '+i.nombre});
try{new QRCode(document.getElementById('qr'),{text:url,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){document.getElementById('qr').textContent='No se pudo generar el código QR. Usa el enlace de abajo.'}
</script></body></html>
